<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Set Password</title>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="initSupabase.js"></script>
  <script defer src="set-password.js"></script>
</head>
<body>
  <main style="max-width:420px;margin:80px auto;font-family:system-ui;">
    <h1>Set your password</h1>
    <p id="msg"></p>

    <label>New password</label><br/>
    <input id="pw" type="password" autocomplete="new-password" style="width:100%;padding:10px;margin:6px 0 12px;" />

    <label>Confirm password</label><br/>
    <input id="pw2" type="password" autocomplete="new-password" style="width:100%;padding:10px;margin:6px 0 12px;" />

    <button id="btn" style="padding:10px 14px;">Save password</button>
  </main>
</body>
</html>
