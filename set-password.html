<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Set Password</title>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="initSupabase.js"></script>
  <script defer src="set-password.js"></script>

  <style>
    :root{
      --bg:#0b0f17;
      --card:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.68);
      --ok:#27d17f;
      --warn:#ffbf3c;
      --err:#ff4d4d;
      --focus:rgba(100,180,255,.35);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 700px at 30% 20%, rgba(120,120,255,.18), transparent 55%),
                  radial-gradient(1100px 700px at 70% 70%, rgba(40,210,160,.14), transparent 60%),
                  var(--bg);
      color:var(--text);
    }
    .card{
      width:min(520px, 100%);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:22px;
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    .brand{
      display:flex; align-items:center; gap:10px; margin-bottom:10px;
    }
    .dot{
      width:10px; height:10px; border-radius:50%;
      background: linear-gradient(180deg, #ffd36a, #caa23b);
      box-shadow: 0 0 18px rgba(255,210,100,.32);
    }
    h1{ margin:6px 0 8px; font-size:22px; letter-spacing:.2px; }
    p.sub{ margin:0 0 14px; color:var(--muted); font-size:14px; line-height:1.4; }
    .banner{
      margin:12px 0 16px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      background: rgba(0,0,0,.18);
      color:var(--muted);
      font-size:14px;
      line-height:1.35;
      white-space:pre-line;
    }
    .banner.ok{ border-color: rgba(39,209,127,.35); color: rgba(230,255,244,.92); }
    .banner.warn{ border-color: rgba(255,191,60,.35); }
    .banner.err{ border-color: rgba(255,77,77,.35); color: rgba(255,235,235,.92); }

    label{ display:block; margin:10px 0 6px; color:var(--muted); font-size:13px; }
    .input{
      width:100%;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      background: rgba(0,0,0,.20);
      color: var(--text);
      outline:none;
    }
    .input:focus{
      border-color: rgba(100,180,255,.55);
      box-shadow: 0 0 0 4px var(--focus);
    }
    .row{
      display:flex;
      gap:10px;
      margin-top:14px;
      align-items:center;
      justify-content:space-between;
    }
    .btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      color: var(--text);
      padding:11px 14px;
      border-radius:12px;
      cursor:pointer;
      font-weight:600;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      width: 100%;
    }
    .btn:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,.24); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
    .hint{ margin-top:10px; font-size:12px; color:var(--muted); }
    .tiny{ font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="dot"></span>
      <div class="tiny">OG • Invsto</div>
    </div>

    <h1>Set your password</h1>
    <p class="sub">This finishes your account setup. After saving, you’ll be sent to the login page.</p>

    <div id="banner" class="banner">Checking invite link…</div>

    <label for="pw">New password</label>
    <input id="pw" class="input" type="password" autocomplete="new-password" placeholder="Minimum 8 characters" />

    <label for="pw2">Confirm password</label>
    <input id="pw2" class="input" type="password" autocomplete="new-password" placeholder="Re-type your password" />

    <div class="row">
      <button id="btn" class="btn">Save password</button>
    </div>

    <div class="hint" id="hint">
      Tip: use a long passphrase (3–5 words) to make it strong and easy to remember.
    </div>
  </main>
</body>
</html>
