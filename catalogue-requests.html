<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102018"><title>Client requests · OG Inventory</title>
<link rel="stylesheet" href="catalogue.css?v=20261010-requests"><link rel="stylesheet" href="inventory-catalogues.css?v=20261010-2"><link rel="stylesheet" href="catalogue-requests.css?v=20261010-requests"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="catalogue-manager"><div class="page"><main class="manager-main request-main">
<header class="manager-heading"><div><p class="eyebrow">PRIVATE COLLECTIONS · PERSONAL SERVICE</p><h1>Client requests</h1><p>Thoughtfully selected. Personally reviewed.</p></div><a href="inventory-catalogues.html" class="manager-button">Manage catalogues ↗</a></header>
<p id="request-message" role="status" aria-live="polite">Loading client requests…</p>
<nav class="request-tabs" aria-label="Request stage"><button data-stage="pending_review" aria-pressed="true">Needs review <b>0</b></button><button data-stage="changes_requested" aria-pressed="false">Awaiting client <b>0</b></button><button data-stage="approved" aria-pressed="false">Approved <b>0</b></button><button data-stage="history" aria-pressed="false">History <b>0</b></button></nav>
<div class="request-tools"><label class="sr-only" for="request-search">Search requests</label><input id="request-search" type="search" placeholder="Find a client, catalogue or request…" maxlength="120"><button id="refresh-requests">Refresh</button></div>
<div class="request-workspace"><aside><p id="request-count"></p><div id="request-list"></div><button id="load-requests" hidden>Load more</button></aside><section id="request-detail" aria-label="Selection details"><div class="request-empty"><span class="brand-monogram">OG</span><h2>A personal touch, at every step.</h2><p>Choose a client request to see their pieces and review the next steps.</p></div></section></div>
</main></div>
<dialog id="review-dialog" class="review-dialog" aria-labelledby="review-title"><div class="dialog-heading"><h2 id="review-title"></h2><button id="cancel-review" class="dialog-close" aria-label="Close review">✕</button></div><p id="review-help"></p><form id="review-form"><label>Message for the client <span id="review-message-label">Optional</span><textarea id="review-message" rows="4" maxlength="2000" placeholder="A thoughtful note with the next steps…"></textarea></label><label id="reference-field" hidden>Completed stock checkout / sales reference<input id="fulfillment-reference" maxlength="200" placeholder="Receipt, sale or checkout reference"></label><label class="review-check"><input type="checkbox" id="review-check" required><span id="review-confirmation"></span></label><p id="review-error" role="alert"></p><button id="confirm-review" class="gold-button" type="submit">Confirm</button></form></dialog>
<script src="initSupabase.js"></script><script src="admin-nav.js?v=20261010-catalogues"></script><script src="catalogue-core.js?v=20261010-requests"></script><script src="catalogue-requests.js?v=20261010-requests"></script><script src="task-notifications.js?v=20261010-catalogue-requests" defer></script></body></html>
