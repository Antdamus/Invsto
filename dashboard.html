<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OG Jewelry Dashboard</title>
  <link href="https://unpkg.com/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <div class="sidebar-inner">
        <div class="logo">OG</div>
        <nav class="nav-links">
          <a class="nav-link" href="dashboard.html"><i class="ti ti-layout-dashboard"></i><span class="link-text">Dashboard</span></a>
          <a class="nav-link" href="add-item.html"><i class="ti ti-plus"></i><span class="link-text">Add Item</span></a>
          <a class="nav-link" href="add-inventory.html"><i class="ti ti-box-seam"></i><span class="link-text">Add Inventory</span></a>
          <a class="nav-link" href="stock.html"><i class="ti ti-archive"></i><span class="link-text">Stock</span></a>
          <a class="nav-link" href="#" id="logout"><i class="ti ti-logout"></i><span class="link-text">Logout</span></a>
        </nav>
      </div>
    </aside>

    <div class="main">
      <header class="header">
        <span id="admin-greeting"><strong>Welcome, Admin</strong></span>
      </header>

      <main class="content">
        <h2 class="page-title">📊 Inventory Summary</h2>

        <div class="metrics-grid" id="metric-cards">
          <!-- Metric cards injected by JS -->
        </div>

        <section class="chart-section">
          <h3 class="section-title">Category Breakdown (Visual)</h3>
          <canvas id="category-chart" class="chart-canvas"></canvas>
        </section>

        <section class="table-section">
          <h3 class="section-title">Category Details</h3>
          <div id="inventory-table-container" class="inventory-table"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="initSupabase.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
