<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Item - OG Jewelry</title>

  <!-- SDKs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="https://qajavascriptsdktests.azurewebsites.net/JavaScript/dymo.connect.framework.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="add-item.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet" />
</head>
<body class="add-body">
  <div class="page">
    <header class="header">
      <a href="dashboard.html" class="back-button">← Back to Dashboard</a>
    </header>

    <main class="add-main">
      <h1 class="add-heading">Add Item Type</h1>
      <form id="add-item-form" class="add-form">
        <input type="text" id="title" placeholder="Item Title" class="add-input" required />
        <textarea id="description" placeholder="Item Description" class="add-input add-textarea" required></textarea>
        <input type="number" step="0.01" id="weight" placeholder="Weight (g or ct)" class="add-input" required />
        
        <label for="category">Category</label>
        <div id="category-dropdown-container" class="custom-dropdown">
          <button id="category-dropdown-toggle" type="button" class="dropdown-toggle">
            Select or Create Category
          </button>
          <div id="category-dropdown-menu" class="dropdown-menu"></div>
        </div>
        <input type="hidden" id="category" name="category" />

        <input type="number" step="0.01" id="cost" placeholder="Cost of Item ($)" class="add-input" required />
        <input type="text" id="sale-price" placeholder="Sale Price (auto)" class="add-input" readonly />

        <input type="text" id="distributor-name" placeholder="Distributor Name (optional)" class="add-input" />
        <input type="tel" id="distributor-phone" placeholder="Distributor Phone" class="add-input" />
        <textarea id="distributor-notes" placeholder="Distributor Notes (optional)" class="add-input add-textarea"></textarea>

        <select id="qr-type" class="add-input" required>
          <option value="" disabled selected>Type of QR code</option>
          <option value="website">Website</option>
          <option value="CGL ID">CGL Certificate</option>
        </select>

        <input type="url" id="qr-code" placeholder="External QR Code" class="add-input" />

        <div class="add-barcode-section">
          <label class="add-label">1D Code</label>
          <div class="add-barcode-options">
            <button type="button" id="generate-barcode" class="add-button-secondary">Generate Barcode</button>
            <span>or</span>
            <input type="text" id="scanned-barcode" placeholder="Paste or Scan Barcode" class="add-input" />
          </div>

          <div id="combined-label" class="combined-label-preview">
            <canvas id="qr-canvas" width="180" height="180"></canvas>
            <canvas id="barcode-canvas" width="300" height="80"></canvas>
          </div>

          <button id="generate-dymo-label" type="button" class="add-button-secondary">Generate DYMO Label</button>
          <div id="dymo-status" style="text-align:center; margin-top: 10px; font-weight: 500;"></div>
        </div>

        <!-- 👤 Admin-only Stock/Location Button -->
        <button type="button" id="btn-open-admin-stock" class="add-button-secondary hidden">
          ➕ Assign Location & Quantity
        </button>

        <!-- NEW MULTI-PHOTO SUPPORT -->
        <input type="file" id="item-photo" class="add-input" accept="image/*" multiple />
        <div id="carousel-preview" class="carousel-preview"></div>
        <div id="photo-status" style="margin-top: 0.5rem; font-size: 0.9rem; color: #444;"></div>

        <!-- 🧾 Pending Stock Assignment Preview -->
        <div id="assignment-preview-box" class="pending-stock-preview hidden">
          <p><strong>📋 This item will be stocked as follows:</strong></p>
          <p id="assignment-location">📍 Location: —</p>
          <p id="assignment-quantity">📦 Quantity: —</p>
        </div>

        <button type="submit" class="add-button">Add Item</button>
      </form>
    </main>
  </div>

  <!-- 🔐 Modal: Assign Location + Quantity for Admin -->
    <div id="modal-admin-assign-location" class="modal hidden">
      <div class="modal-content-assign-location">
        <div class="modal-header-assign-location">Assign Location and Quantity</div>
        <div class="modal-body-assign-location">

          <!-- 🔹 Location Name Dropdown -->
          <label for="admin-location-name">Location</label>
          <div class="custom-dropdown">
            <button id="admin-location-dropdown-toggle" type="button" class="dropdown-toggle">Select Location</button>
            <div id="admin-location-dropdown-menu" class="dropdown-menu"></div>
          </div>
          <input type="hidden" id="admin-location-name" />

          <!-- 🔢 Quantity Input -->
          <label for="admin-stock-quantity">Stock Quantity</label>
          <input type="number" id="admin-stock-quantity" placeholder="Enter quantity" min="0" />

        </div>

        <div class="modal-footer-assign-location">
          <button id="btn-confirm-admin-stock" class="btn-location-confirm">Confirm</button>
          <button id="btn-cancel-admin-stock" class="btn-location-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>



  <script src="initSupabase.js"></script>
  <script src="additem.js"></script>
</body>
</html>
