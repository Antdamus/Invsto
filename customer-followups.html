<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111713"><title>Customer follow-ups · OG Jewelers</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="customer-followups.css?v=20261108-care"></head>
<body data-page="customer-followups"><div class="page"><aside class="sidebar"><div class="sidebar-inner"><div class="logo">OG</div><nav class="nav-links"></nav></div></aside><div class="main"><main class="content" id="cf-page">
<header class="cf-hero"><div><span class="cf-eyebrow">OG JEWELERS · CUSTOMER CARE</span><h1>Customer follow-ups</h1><p>Calls, conversations, and manual returns. One shared record of the next step.</p></div><div class="cf-actions"><button data-cf-kind="call" class="cf-primary">New call reminder</button><button data-cf-kind="manual_return">New manual return</button></div></header>
<p id="cf-status" role="status">Loading the shared workspace…</p>
<section class="cf-board" aria-label="Follow-up workspace"><div class="cf-toolbar"><div class="cf-tabs" aria-label="Record type"><button data-cf-tab="calls" aria-pressed="true">Calls</button><button data-cf-tab="returns" aria-pressed="false">Manual returns</button><button data-cf-tab="all" aria-pressed="false">All</button></div><button id="cf-refresh">Refresh</button></div>
<div class="cf-filters"><label>Search<input type="search" id="cf-search" placeholder="Customer, phone, order, tracking, title…"></label><label>Status<select id="cf-filter-status"><option value="active">Open &amp; waiting</option><option value="all">All statuses</option><option value="open">Open</option><option value="waiting">Waiting</option><option value="closed">Closed</option><option value="cancelled">Cancelled</option></select></label><label>Due<select id="cf-filter-due"><option value="all">Any time</option><option value="overdue">Overdue</option><option value="today">Due today (Eastern)</option><option value="none">No date set</option></select></label></div>
<div class="cf-report-actions"><span id="cf-count"></span><div><button id="cf-report-calls">Generate calls report</button><button id="cf-report-returns">Generate manual returns report</button></div></div>
<p class="cf-help">Reports use the search, status and due-date filters above. Include all statuses for a complete history.</p><div id="cf-list"></div></section>
<section id="cf-detail" class="cf-detail" hidden aria-label="Selected follow-up"></section>
</main></div></div>
